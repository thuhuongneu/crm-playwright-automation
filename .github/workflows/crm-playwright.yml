name: CRM Playwright

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # TẠM để thử lịch: 10:40 UTC = 17:40 giờ Việt Nam. Thử xong đổi lại '50 9 * * *' (16:50 giờ Việt Nam)
    - cron: '40 10 * * *'

env:
  NODE_VERSION: '22'
  # Runner GitHub chỉ có 2 vCPU; server demo hay treo khi chạy nhiều trình duyệt song song
  WORKERS: '2'
  HEADLESS: 'true'
  # TC cố tình FAIL vì app đang có bug — loại khỏi lượt CI, KHÔNG hạ assertion trong code.
  # @knownbug / @pendingamb: theo tag. Hai TC còn lại chưa gắn tag nên loại theo tên:
  #   CRM_LOGIN_TC_004 (bấm logo, chờ PO) · BK_AUTH_TC_068-d (name 10.000 ký tự).
  # Bỏ khỏi danh sách này khi bug được sửa.
  EXCLUDE_KNOWN_BUGS: '@knownbug|@pendingamb|Bấm logo trên trang đăng nhập|không gây lỗi máy chủ \(biến thể d'

jobs:
  ui-crm:
    name: UI CRM (Perfex)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PR từ fork không đọc được secrets -> suite sẽ crash vì thiếu biến môi trường
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: ui-crm-${{ github.ref }}
      cancel-in-progress: true
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      PM_EMAIL: ${{ secrets.PM_EMAIL }}
      PM_PASSWORD: ${{ secrets.PM_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Cài Chromium
        run: npx playwright install chromium --with-deps

      - name: Chạy test UI
        run: npx playwright test --grep-invert "$EXCLUDE_KNOWN_BUGS"

      # Allure 2 (CLI allure-commandline trong project, cần Java — runner ubuntu-latest có sẵn). Lỗi sinh report không được che kết quả test
      - name: Sinh report Allure 2
        if: always()
        continue-on-error: true
        run: npx allure generate reports/allure-results -o reports/allure-report-single --clean --single-file

      - name: Upload Allure 2 (1 file HTML, mở thẳng bằng trình duyệt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-ui
          path: reports/allure-report-single/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-ui
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  api-book:
    name: API Book
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Suite này ĐĂNG KÝ rồi XOÁ tài khoản trên server demo dùng chung -> không chạy ở PR, và không cho hai lượt chạy chồng nhau
    if: github.event_name != 'pull_request'
    concurrency:
      group: api-book
      cancel-in-progress: false
    env:
      BOOK_API_BASE_URL: ${{ secrets.BOOK_API_BASE_URL }}
      # Runner GitHub gọi server demo xa nên độ trễ cao hơn local (đo được 2.0-3.4s); local vẫn dùng 2000
      API_SLA_MS: '5000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Chạy test API
        run: npx playwright test -c playwright.api.config.ts --grep-invert "$EXCLUDE_KNOWN_BUGS"

      - name: Sinh report Allure 2
        if: always()
        continue-on-error: true
        run: npx allure generate reports/api/allure-results -o reports/api/allure-report-single --clean --single-file

      - name: Upload Allure 2 (1 file HTML, mở thẳng bằng trình duyệt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-api
          path: reports/api/allure-report-single/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-api
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  publish-report:
    name: Publish Allure 2 lên GitHub Pages
    needs: [ui-crm, api-book]
    # Chạy cả khi test đỏ để vẫn xem được report; chỉ publish từ main (không phải PR)
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: allure-report-*

      - name: Dựng site (ui/ · api/ · trang chủ)
        run: |
          mkdir -p _site/ui _site/api
          [ -f allure-report-ui/index.html ] && cp allure-report-ui/index.html _site/ui/index.html
          [ -f allure-report-api/index.html ] && cp allure-report-api/index.html _site/api/index.html
          {
            echo '<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Allure 2 Reports</title></head><body>'
            echo '<h1>Allure 2 Reports</h1>'
            echo '<ul>'
            [ -f _site/ui/index.html ] && echo '<li><a href="ui/">UI CRM (Perfex)</a></li>'
            [ -f _site/api/index.html ] && echo '<li><a href="api/">API Book</a></li>'
            echo '</ul>'
            echo "<p>Lượt chạy: <a href=\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">#${GITHUB_RUN_ID}</a> · ${GITHUB_EVENT_NAME} · commit ${GITHUB_SHA::7}</p>"
            echo '</body></html>'
          } > _site/index.html
          ls -R _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5

  notify-chat:
    name: Gửi kết quả vào Google Chat (space Note)
    needs: [ui-crm, api-book, publish-report]
    # Báo sau MỌI lượt chạy có kết quả (pass hay fail), trừ PR (job test không chạy ở PR từ fork, không có secret)
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GCHAT_WEBHOOK_NOTE: ${{ secrets.GCHAT_WEBHOOK_NOTE }}
      UI_RESULT: ${{ needs.ui-crm.result }}
      API_RESULT: ${{ needs.api-book.result }}
      PAGES_RESULT: ${{ needs.publish-report.result }}
    steps:
      - name: Gửi tin
        run: |
          icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          PAGES="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NOW=$(TZ=Asia/Ho_Chi_Minh date '+%H:%M %d-%m-%Y')
          MSG="*CRM Playwright — kết quả CI* (${NOW})
          UI CRM: $(icon "$UI_RESULT") ${UI_RESULT}
          API Book: $(icon "$API_RESULT") ${API_RESULT}
          Sự kiện: ${GITHUB_EVENT_NAME} · commit ${GITHUB_SHA::7}
          Report Allure 2: UI ${PAGES}/ui/ · API ${PAGES}/api/
          Lượt chạy: ${RUN}"
          if [ "$PAGES_RESULT" != "success" ]; then MSG="${MSG}
          ⚠️ Chưa publish được report lên Pages (${PAGES_RESULT}) — xem artifact allure-report-* trong lượt chạy."; fi
          jq -n --arg text "$MSG" '{text: $text}' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json; charset=UTF-8' -d @- "$GCHAT_WEBHOOK_NOTE" > /dev/null
